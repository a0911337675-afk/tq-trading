<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>文章 - TQ Trading</title>
    <script>
        document.documentElement.dataset.theme = localStorage.getItem("tq-theme")
            || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    </script>
    <link rel="stylesheet" href="/styles.css?v=term-highlight-1">
</head>
<body>
    <header class="site-header">
        <div class="topbar">
            <button class="menu-toggle" id="menuToggle" type="button" aria-label="開啟選單" aria-controls="siteDrawer" aria-expanded="false"><span></span><span></span><span></span></button>
            <a class="brand" href="/">
                <img src="/assets/tq-trading-logo.png" alt="">
                <span>TQ Trading</span>
            </a>
            <span class="header-spacer"></span>
            <button class="theme-toggle" id="themeToggle" type="button" aria-label="切換顯示模式"></button>
        </div>
    </header>
    <div class="menu-overlay" id="menuOverlay" aria-hidden="true">
        <aside class="site-drawer" id="siteDrawer" aria-label="網站選單">
            <div class="drawer-head"><strong>網站選單</strong><button type="button" data-close-menu aria-label="關閉選單">×</button></div>
            <nav class="drawer-nav"><a href="/">首頁</a><a href="/daily">每日大事</a><a href="/faq">FAQ</a><a href="/links">快速連結</a></nav>
        </aside>
    </div>

    <main class="shell article-shell">
        <article class="article-page">
            <p class="section-kicker" id="articleCategory">文章</p>
            <h1 id="articleTitle">載入中</h1>
            <p class="meta" id="articleMeta"></p>
            <div class="article-cover">
                <img src="/assets/stock-finance-banner.png" alt="">
            </div>
            <div class="article-body" id="articleBody"></div>
        </article>
    </main>

    <script src="/article.js?v=term-highlight-1"></script>
    <script src="/site.js?v=nav-theme-2"></script>
</body>
</html>
