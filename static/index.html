<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TQ Trading</title>
    <link rel="stylesheet" href="/styles.css?v=typeui-refresh-2">
</head>
<body>
    <header class="site-header">
        <div class="topbar">
            <a class="brand" href="/">
                <img src="/assets/tq-trading-logo.png" alt="">
                <span>TQ Trading</span>
            </a>
            <nav class="main-nav" aria-label="主選單">
                <a class="active" href="/">首頁</a>
                <a href="/articles">文章</a>
                <a href="#categories">分類</a>
                <a href="#summary">總覽</a>
            </nav>
            <a class="header-action" href="/articles">Browse</a>
        </div>
    </header>

    <main class="shell">
        <section class="hero">
            <article class="hero-copy">
                <p class="section-kicker">Strategy · Data · Execution</p>
                <h1>交易研究、AI 工具與風險筆記</h1>
                <p class="meta">用清楚的分類整理量化基礎、交易實戰、工具比較、AI 對帳單與市場觀察。</p>
                <form class="search" id="searchForm">
                    <input id="searchInput" name="search" type="search" placeholder="搜尋文章、類別、關鍵字">
                    <button type="submit">搜尋</button>
                </form>
            </article>
            <div class="hero-media">
                <img src="/assets/stock-finance-banner.png" alt="交易資料儀表板">
                <span class="category-pill">TQ Trading</span>
            </div>
        </section>

        <section class="content-layout" id="summary">
            <section class="main-column">
                <div class="block-title">
                    <span>內容總覽</span>
                </div>
                <section class="metrics" aria-label="內容總覽">
                    <article>
                        <span>已發布文章</span>
                        <strong id="productCount">0</strong>
                    </article>
                    <article>
                        <span>總瀏覽量</span>
                        <strong id="totalQuantity">0</strong>
                    </article>
                    <article>
                        <span>搜尋次數</span>
                        <strong id="inventoryValue">0</strong>
                    </article>
                    <article class="warning">
                        <span>草稿文章</span>
                        <strong id="lowStockCount">0</strong>
                    </article>
                </section>

                <section class="table-panel category-panel" id="categories">
                    <div class="table-head">
                        <div>
                            <p class="section-kicker">文章分類</p>
                            <h2>文章類別</h2>
                        </div>
                        <button id="refreshButton" type="button">更新</button>
                    </div>
                    <div class="table-wrap">
                        <table class="category-table">
                            <thead>
                                <tr>
                                    <th>類別</th>
                                    <th>內容方向</th>
                                    <th>已發布文章</th>
                                    <th>狀態</th>
                                    <th>入口</th>
                                </tr>
                            </thead>
                            <tbody id="categoryRows"></tbody>
                        </table>
                    </div>
                </section>

                <section class="article-list compact-articles article-index" id="articles">
                    <div class="article-index-head">
                        <p class="section-kicker">AI · CODE · QUANT</p>
                        <h2>最新文章</h2>
                        <p>整理量化交易、AI 工具、策略研究與市場觀察，快速找到你想看的主題。</p>
                    </div>
                    <div class="article-toolbar" aria-label="文章顯示設定">
                        <div class="view-toggle" role="group" aria-label="文章排列方式">
                            <button class="active" type="button" data-view-mode="grid" aria-pressed="true">九宮格</button>
                            <button type="button" data-view-mode="list" aria-pressed="false">橫列</button>
                        </div>
                        <button class="show-more-button" id="showMoreArticles" type="button" hidden>顯示更多文章</button>
                    </div>
                    <div class="article-filters" id="articleFilters" aria-label="文章分類篩選"></div>
                    <div class="article-grid" id="articleCards"></div>
                </section>
            </section>

            <aside class="sidebar">
                <section class="panel">
                    <div class="block-title">
                        <span>文章類別</span>
                    </div>
                    <div class="category-list" id="categoryList"></div>
                </section>

                <section class="mini-posts" aria-label="文章導覽">
                    <div class="block-title">
                        <span>文章導覽</span>
                    </div>
                    <div id="quickArticleLinks"></div>
                </section>
            </aside>
        </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="/app.js?v=typeui-refresh-1"></script>
</body>
</html>
