<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TQ Trading</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header class="site-header">
        <div class="brandbar">
            <a class="brand" href="/">
                <img src="/assets/tq-trading-logo.png" alt="">
                <span>TQ Trading</span>
            </a>
            <div class="social-dots" aria-label="社群連結">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
        <nav class="main-nav" aria-label="主選單">
            <a class="active" href="/">首頁</a>
            <a href="#articles">文章</a>
            <a href="#categories">文章類別</a>
            <a href="#summary">內容總覽</a>
        </nav>
    </header>

    <main class="shell">
        <section class="hero">
            <div class="hero-media">
                <img src="/assets/stock-finance-banner.png" alt="交易資料儀表板">
                <span class="category-pill">Trading Research</span>
            </div>
            <article class="hero-copy">
                <p class="section-kicker">Strategy · Data · Execution</p>
                <h1>TQ Trading</h1>
                <p class="meta">量化研究、交易實戰、AI 工具與市場筆記</p>
                <form class="search" id="searchForm">
                    <input id="searchInput" name="search" type="search" placeholder="搜尋文章、類別、關鍵字">
                    <button type="submit">搜尋</button>
                </form>
            </article>
        </section>

        <section class="content-layout" id="summary">
            <section class="main-column">
                <div class="block-title">
                    <span>內容總覽</span>
                </div>
                <section class="metrics" aria-label="內容總覽">
                    <article>
                        <span>已發布文章</span>
                        <strong id="productCount">0</strong>
                    </article>
                    <article>
                        <span>總瀏覽量</span>
                        <strong id="totalQuantity">0</strong>
                    </article>
                    <article>
                        <span>搜尋次數</span>
                        <strong id="inventoryValue">0</strong>
                    </article>
                    <article class="warning">
                        <span>草稿文章</span>
                        <strong id="lowStockCount">0</strong>
                    </article>
                </section>

                <section class="article-list" id="articles">
                    <div class="block-title">
                        <span>最新文章</span>
                    </div>
                    <div class="article-grid" id="articleCards"></div>
                </section>

                <section class="table-panel" id="categories">
                    <div class="table-head">
                        <div>
                            <p class="section-kicker">文章分類</p>
                            <h2>文章類別</h2>
                        </div>
                        <button id="refreshButton" type="button">更新</button>
                    </div>
                    <div class="table-wrap">
                        <table class="category-table">
                            <thead>
                                <tr>
                                    <th>類別</th>
                                    <th>內容方向</th>
                                    <th>已發布文章</th>
                                    <th>狀態</th>
                                    <th>入口</th>
                                </tr>
                            </thead>
                            <tbody id="categoryRows"></tbody>
                        </table>
                    </div>
                </section>
            </section>

            <aside class="sidebar">
                <section class="panel">
                    <div class="block-title">
                        <span>文章類別</span>
                    </div>
                    <div class="category-list" id="categoryList"></div>
                </section>

                <section class="mini-posts" aria-label="文章導覽">
                    <div class="block-title">
                        <span>文章導覽</span>
                    </div>
                    <div id="quickArticleLinks"></div>
                </section>
            </aside>
        </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="/app.js?v=categories-1"></script>
</body>
</html>
